name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    name: build, unit tests, TUI integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3 libarchive-dev ffmpeg qt6-base-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKOLMA_WARNINGS_AS_ERRORS=ON

      - name: Build engine, tests and desktop GUI
        run: cmake --build build

      - name: Engine test suite
        run: ./build/kolma_tests

      - name: Smoke-test the CLI on a real file
        run: |
          set -euo pipefail
          ./build/kolma algos
          ./build/kolma analyze README.md
          ./build/kolma compress README.md --out /tmp/readme.kolma
          ./build/kolma info /tmp/readme.kolma
          ./build/kolma decompress /tmp/readme.kolma --out /tmp/readme.out
          cmp README.md /tmp/readme.out
          ./build/kolma bench README.md --limit 64K

      - name: Smoke-test the CLI through pipes
        run: |
          set -euo pipefail
          cat README.md | ./build/kolma compress - -q > /tmp/pipe.kolma
          ./build/kolma decompress /tmp/pipe.kolma -o - -q > /tmp/pipe.out
          cmp README.md /tmp/pipe.out
          KOLMA_PASSWORD=ci ./build/kolma compress - -q < README.md 2>/dev/null \
            | KOLMA_PASSWORD=ci ./build/kolma decompress - -q 2>/dev/null > /tmp/pipe-enc.out
          cmp README.md /tmp/pipe-enc.out
          if ./build/kolma compress README.md -o - --json -q >/dev/null 2>&1; then
            echo "--json with stdout output must be refused"; exit 1
          fi

      - name: Smoke-test standard-format archives (zip interop)
        run: |
          set -euo pipefail
          mkdir -p /tmp/kolma-std/proj/sub
          echo "hello standard formats" > /tmp/kolma-std/proj/a.txt
          echo "nested file" > /tmp/kolma-std/proj/sub/b.txt
          ./build/kolma compress /tmp/kolma-std/proj --format zip -o /tmp/kolma-std/out.zip --force --quiet
          # An independent standard implementation must read what kolma produced.
          python3 -c "import zipfile,sys; z=zipfile.ZipFile('/tmp/kolma-std/out.zip'); sys.exit(0 if z.testzip() is None else 1)"
          ./build/kolma list /tmp/kolma-std/out.zip
          ./build/kolma extract /tmp/kolma-std/out.zip /tmp/kolma-std/roundtrip --force --quiet
          cmp /tmp/kolma-std/proj/a.txt /tmp/kolma-std/roundtrip/proj/a.txt
          cmp /tmp/kolma-std/proj/sub/b.txt /tmp/kolma-std/roundtrip/proj/sub/b.txt
          # And kolma must read a zip made by a standard tool.
          python3 -c "import zipfile; z=zipfile.ZipFile('/tmp/kolma-std/sys.zip','w'); z.write('/tmp/kolma-std/proj/a.txt','proj/a.txt'); z.close()"
          ./build/kolma extract /tmp/kolma-std/sys.zip /tmp/kolma-std/fromsys --force --quiet
          cmp /tmp/kolma-std/proj/a.txt /tmp/kolma-std/fromsys/proj/a.txt

      - name: Smoke-test media shrinking (ffmpeg)
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -nostdin -y -f lavfi \
            -i testsrc2=duration=2:size=320x240:rate=15 \
            -c:v libx264 -crf 10 -pix_fmt yuv420p /tmp/clip.mp4
          ./build/kolma shrink /tmp/clip.mp4 --quality smallest -o /tmp/clip-small.mp4 --force
          # Shrunk file must be smaller and still a valid, decodable video.
          python3 -c "import os,sys; sys.exit(0 if os.path.getsize('/tmp/clip-small.mp4') < os.path.getsize('/tmp/clip.mp4') else 1)"
          ffmpeg -hide_banner -nostdin -i /tmp/clip-small.mp4 -f null - 2>/dev/null

      - name: Smoke-test multipart split / join / in-place extraction
        run: |
          set -euo pipefail
          mkdir -p /tmp/kolma-mp/data
          echo "volume one content" > /tmp/kolma-mp/data/a.txt
          head -c 30000 /dev/urandom > /tmp/kolma-mp/data/b.bin
          ./build/kolma compress /tmp/kolma-mp/data --format tar -o /tmp/kolma-mp/data.tar --force --quiet
          ./build/kolma split /tmp/kolma-mp/data.tar --part-size 8K
          rm /tmp/kolma-mp/data.tar
          # join reconstructs the archive; in-place extraction streams the volumes
          # and reclaims them as their data is committed.
          ./build/kolma join /tmp/kolma-mp/data.tar.001 -o /tmp/kolma-mp/rejoined.tar --quiet
          ./build/kolma extract /tmp/kolma-mp/data.tar.001 /tmp/kolma-mp/out --in-place --keep-free 0 --force --quiet
          cmp /tmp/kolma-mp/data/a.txt /tmp/kolma-mp/out/data/a.txt
          cmp /tmp/kolma-mp/data/b.bin /tmp/kolma-mp/out/data/b.bin
          # in-place must have reclaimed the source volumes
          test ! -e /tmp/kolma-mp/data.tar.001

      - name: Build the TUI
        run: cd tui && go vet ./... && go build -o kolma-tui .

      - name: TUI tests
        run: cd tui && KOLMA_BIN=${{ github.workspace }}/build/kolma go test ./...

      - name: TUI smoke test through a pty
        run: python3 scripts/tui_smoke.py --tui tui/kolma-tui --engine build/kolma

  sanitizers:
    name: address + undefined behaviour sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libarchive-dev ffmpeg

      - name: Configure with sanitizers
        run: cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DKOLMA_SANITIZE=ON

      - name: Build
        run: cmake --build build-asan

      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./build-asan/kolma_tests

  fuzz:
    name: libFuzzer against the parser and every decoder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Configure with libFuzzer
        run: cmake -S . -B build-fuzz -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DKOLMA_FUZZ=ON

      - name: Build the harness
        run: cmake --build build-fuzz --target kolma_fuzz

      - name: Fuzz for 60 seconds
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./build-fuzz/kolma_fuzz tests/fuzz_corpus -max_total_time=60 -timeout=10 -rss_limit_mb=2048
