name: release

# Security note: every ${{ matrix.* }} interpolation below is a hardcoded
# constant defined in this file's strategy matrix (linux/darwin/windows, etc.),
# never attacker-controlled event input. GITHUB_REF_NAME is the pushed tag and
# is always double-quoted where used.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ------------------------------------------------------- CLI + TUI builds --
  cli:
    name: cli ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-latest
            platform: darwin
            arch: amd64
            cmake-arch: x86_64
            goarch: amd64
          - os: windows-latest
            platform: windows
            arch: x64
            goos: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: Install Ninja (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Ninja everywhere: the Visual Studio generator fails to locate VS on the
      # windows runner, while Ninja + the msvc-dev-cmd environment is reliable.
      # Single-config Ninja puts binaries in build/, not build/Release/.
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKOLMA_GUI=OFF \
            -DKOLMA_WARNINGS_AS_ERRORS=ON \
            ${{ matrix.cmake-arch && format('-DCMAKE_OSX_ARCHITECTURES={0}', matrix.cmake-arch) || '' }}

      - name: Build the engine + CLI
        run: cmake --build build --config Release

      - name: Test the engine
        # Skipped for the darwin-amd64 cross-build (x86_64 can't run on arm64).
        if: ${{ !matrix.cmake-arch }}
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then ./build/kolma_tests.exe; else ./build/kolma_tests; fi

      - name: Build the TUI
        shell: bash
        run: |
          cd tui
          ext=""
          if [ "${{ matrix.platform }}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w" -o "kolma-tui$ext" .
        env:
          GOARCH: ${{ matrix.goarch || '' }}
          GOOS: ${{ matrix.goos || '' }}
          CGO_ENABLED: "0"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          stage=kolma-${{ matrix.platform }}-${{ matrix.arch }}
          mkdir "$stage"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp build/kolma.exe tui/kolma-tui.exe "$stage/"
          else
            cp build/kolma tui/kolma-tui "$stage/"
          fi
          cp README.md LICENSE "$stage/"
          tar czf "$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: kolma-${{ matrix.platform }}-${{ matrix.arch }}
          path: kolma-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # ----------------------------------------------------- desktop GUI builds --
  gui:
    name: gui ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linuxdeployqt refuses hosts newer than ubuntu-22.04 ("host system
          # is too new"), so the AppImage is built on 22.04, not latest.
          - os: ubuntu-22.04
            platform: linux
          # AGL is stripped from Qt's link interface in CMakeLists, so the GUI
          # builds on macos-latest (macos-15) despite AGL being removed there.
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Install build tools (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libfuse2

      - name: Set up MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKOLMA_GUI=ON \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"

      - name: Build the desktop app
        run: cmake --build build --config Release --target kolma-desktop

      - name: Package (Linux AppImage)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/kolma-desktop AppDir/usr/bin/
          cp app/data/kolma.desktop AppDir/usr/share/applications/
          cp app/data/kolma.desktop AppDir/kolma.desktop
          cp app/data/kolma.png AppDir/usr/share/icons/hicolor/256x256/apps/
          cp app/data/kolma.png AppDir/kolma.png
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage -O linuxdeployqt
          chmod +x linuxdeployqt
          export VERSION="${GITHUB_REF_NAME#v}"
          export ARCH=x86_64
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeployqt AppDir/usr/share/applications/kolma.desktop -appimage -bundle-non-qt-libs -extra-plugins=imageformats,iconengines
          mv kolma*.AppImage kolma-desktop-linux-x86_64.AppImage

      - name: Package (macOS DMG)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          macdeployqt build/kolma-desktop.app -dmg
          mv build/kolma-desktop.dmg kolma-desktop-macos-arm64.dmg

      - name: Package (Windows zip)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/kolma-desktop.exe dist/
          windeployqt dist/kolma-desktop.exe --release --no-translations --compiler-runtime
          Compress-Archive -Path dist/* -DestinationPath kolma-desktop-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kolma-desktop-${{ matrix.platform }}
          path: kolma-desktop-*
          if-no-files-found: error

  # ------------------------------------------------------------- publish -----
  release:
    name: publish the release
    needs: [cli, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum kolma-* > checksums.txt
          cat checksums.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/kolma-* dist/checksums.txt \
            --title "kolma $GITHUB_REF_NAME" --generate-notes
